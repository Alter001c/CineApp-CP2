<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sitio web de visualización de películas online">
    <meta name="keywords" content="Películas, catálogo">
    <title>CineApp - Películas Online</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./script.js" defer></script>
</head>
<body>
    <header>
        <div class="page-title">
            <h1>Cine<span>App</span></h1>
            <p>Tus películas favoritas, siempre a mano</p>
        </div>
        <form action="" class="search-bar">
            <input type="search" id="search-input" placeholder="Buscar películas...">
            <button id="search-btn">Buscar</button>
            <div class="fav-counter">
                <svg class="star-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
                </svg>
                <span id="fav-count">0</span>
            </div>
        </form>
    </header>
    <main class="content-area">
        <section class="filters">
            <div>
                <button class="btn-all">Todas</button>
                <button class="btn-fav">Favoritas</button>
            </div>
            <p id="movies-amount">0 películas encontradas</p>
            <div>
                <label for="sort">Ordenar:</label>
                <select class="filter-sort" name="sort" id="sort">
                    <option value="recent">Más recientes</option>
                    <option value="alpha">Alfabético</option>
                </select>                
            </div>
        </section>
        <section class="movie-section"></section>
    </main>
    <footer>
        <p>CineApp <span>|</span> Disfruta, guarda y revive tus películas favoritas</p>
    </footer>
</body>
</html>
